[package]
name = "savant_cli"
version = "0.3.2"
edition = "2021"
license.workspace = true

[[bin]]
name = "savant-cli"
path = "src/main.rs"

[[bin]]
name = "savant"
path = "src/savant.rs"

[dependencies]
savant_core = { workspace = true }
savant_gateway = { workspace = true }
savant_agent = { workspace = true }
savant_skills = { workspace = true }
savant_mcp = { workspace = true }
savant_cli_gateway = { workspace = true }
savant_cli_tui = { workspace = true }
savant_cli_session = { workspace = true }
savant_channels = { path = "../channels" }
savant_canvas = { path = "../canvas" }
tokio = { workspace = true }
pqcrypto-dilithium = "0.5"
figment = { version = "0.10", features = ["env", "toml"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
tracing = { workspace = true }
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.0"
walkdir = "2.5"
uuid = { version = "1.0", features = ["v4"] }
chrono = { workspace = true }

[dev-dependencies]
uuid = { version = "1.0", features = ["v4"] }

[lints]
workspace = true
