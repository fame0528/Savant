[package]
name = "savant_cli_tui"
version = "0.3.2"
edition = "2021"
license.workspace = true
description = "Terminal UI for Savant CLI — ratatui + tui-realm based AI coding companion"

[dependencies]
savant_core = { workspace = true }
savant_cli_gateway = { workspace = true }
savant_cli_session = { workspace = true }
savant_cli_core = { workspace = true }
ratatui = { version = "0.29", features = ["crossterm", "macros"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tuirealm = "4.1"
tui-realm-stdlib = "4.1"
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = "0.4"

[lints]
workspace = true
